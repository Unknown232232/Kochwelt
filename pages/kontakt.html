<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kochwelt - Kontakt</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo_small.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="nav-inner">
          <a href="./index.html" class="logo">
            <img src="../assets/img/logo.png" alt="Kochwelt" />
          </a>

          <ul class="nav-links">
            <li><a href="../index.html">Start</a></li>
            <li><a href="#bestoftheday">Rezept des Tages</a></li>
            <li><a href="./kontakt.html" class="active">Kontakt</a></li>
            <li><a href="#Impressum">Impressum</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="kontakt-main">
      <section class="kontakt-section">
        <div class="kontakt-box">
          <h2 class="kontakt-titel">Kontaktiere uns</h2>

          <form class="kontakt-form">
            <div class="form-group">
              <label for="name">Dein Name:</label>
              <input type="text" id="name" name="name" required />
            </div>

            <div class="form-group">
              <label for="email">Deine E-Mail:</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="nachricht">Deine Nachricht:</label>
              <textarea
                id="nachricht"
                name="nachricht"
                rows="6"
                required
              ></textarea>
            </div>

            <button type="submit" class="kontakt-button">Abschicken</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <!-- Social Media -->
      <div class="footer-bereich">
        <h4>Folge uns</h4>

        <div class="footer-icons">
          <a href="https://www.instagram.com/" target="_blank"
            ><img src="../assets/img/instagram.png" alt="Instagram"
          /></a>
          <a href="https://www.facebook.com/" target="_blank"
            ><img src="../assets/img/facebook.png" alt="Facebook"
          /></a>
          <a href="https://www.linkedin.com/" target="_blank"
            ><img src="../assets/img/linkedin.png" alt="LinkedIn"
          /></a>
          <a href="https://youtube.com/" target="_blank"
            ><img src="../assets/img/youtube.png" alt="YouTube"
          /></a>
          <a href="https://www.whatsapp.com/?lang=de" target="_blank"
            ><img src="../assets/img/whatsapp.png" alt="WhatsApp"
          /></a>
        </div>
      </div>

      <!-- Rechtliches -->
      <div class="footer-bereich">
        <h4>Rechtliches</h4>

        <ul class="rechtliches-liste">
          <li>
            <a href="./pages/impressum.html"> Impressum</a>
          </li>
          <li>
            <a href="./pages/datenschutz.html"> Datenschutz</a>
          </li>
          <li><a href="#"> AGB</a></li>
        </ul>
      </div>

      <!-- Newsletter -->
      <div class="footer-bereich">
        <h4>Newsletter</h4>

        <form class="footer-form">
          <input required type="email" placeholder="Email address" />

          <button type="submit">Anmelden</button>
        </form>
      </div>
    </footer>
  </body>
</html>
